# SobaFM first amd64 slice. The limits are ADR 0012's and the app refuses to
# start under any others. Copy .env.example to .env and fill in real values.
# ADR 0009 records the volume layout.
services:
  sobafm:
    build: .
    image: sobafm:local
    platform: linux/amd64
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 268435456
    memswap_limit: 268435456
    pids_limit: 64
    cpus: 2
    restart: on-failure:5
    env_file: .env
    volumes:
      # Catalog, reviews, media manifest and audio: read-only.
      - ./catalog:/catalog:ro
      # The settings database. A new named volume takes the ownership of the
      # image's /data, UID 1000, so it needs no host setup.
      - data:/data
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

volumes:
  data:
    name: sobafm-data

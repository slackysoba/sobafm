name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1" # Mondays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Vulnerabilities and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: 2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
      # Licenses compatible with distributing SobaFM under MIT.
      ALLOWED_LICENSES: MIT,MIT-0,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,0BSD,PSF-2.0,Python-2.0,MPL-2.0,Unlicense,CC0-1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
      - name: Scan uv.lock
        run: ./osv-scanner scan source --config osv-scanner.toml --lockfile uv.lock --licenses="${ALLOWED_LICENSES}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Reviewed exception, recorded in osv-scanner.toml.
          allow-ghsas: GHSA-mrfv-m5wm-5w6w

  # The single required check: fails when any job above fails or is cancelled. Dependency review
  # is skipped outside pull requests, which does not fail the gate.
  gate:
    name: security
    if: always()
    needs: [dependencies, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

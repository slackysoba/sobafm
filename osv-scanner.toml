# Reviewed exceptions for the dependency scan in .github/workflows/security.yml.
# Every entry states its reason; vulnerability exceptions also expire.

# PyNaCl 1.5 (CVE-2025-69277) is pinned by discord.py 2.7's voice extra. The flaw is in
# crypto_core_ed25519_is_valid_point, which discord.py never calls: its voice client uses only
# nacl.secret.Aead, nacl.secret.SecretBox, and nacl.utils.random. Remove once discord.py allows
# PyNaCl 1.6.2 or later (ADR-0001, #9).
[[IgnoredVulns]]
id = "GHSA-mrfv-m5wm-5w6w"
ignoreUntil = 2027-01-31
reason = "Not reachable through discord.py's voice client; pinned by discord.py 2.7 (ADR-0001, #9)."

# Dependencies whose metadata carries license text or a classifier instead of an SPDX
# identifier. Each override matches the license in the package's own repository.
[[PackageOverrides]]
name = "colorama"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]
reason = "github.com/tartley/colorama is BSD-3-Clause."

[[PackageOverrides]]
name = "discord-py"
ecosystem = "PyPI"
license.override = ["MIT"]
reason = "github.com/Rapptz/discord.py is MIT."

[[PackageOverrides]]
name = "nodeenv"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]
reason = "github.com/ekalinin/nodeenv carries the three-clause BSD license text."

[[PackageOverrides]]
name = "pyasn1-modules"
ecosystem = "PyPI"
license.override = ["BSD-2-Clause"]
reason = "github.com/pyasn1/pyasn1-modules is BSD-2-Clause."

[[PackageOverrides]]
name = "python-discovery"
ecosystem = "PyPI"
license.override = ["MIT"]
reason = "github.com/tox-dev/python-discovery is MIT."

# SobaFM itself is not published, so osv-scanner cannot look up its license.
[[PackageOverrides]]
name = "sobafm"
ecosystem = "PyPI"
license.override = ["MIT"]
reason = "This project; see LICENSE."

# The direct-release version is not published on PyPI. Supply its verified license
# metadata, without ignoring its vulnerabilities or changing allowed licenses.
[[PackageOverrides]]
name = "google-genai"
version = "2.26.0+sobafm.2"
ecosystem = "PyPI"
license.override = ["Apache-2.0", "MIT"]
reason = "Exact derived distribution; third_party/google-genai/UPSTREAM.toml, BUFFERED-INPUT.toml, NOTICE.buffered-input and the published sobafm.2 manifest record the upstream Apache-2.0 and MIT additions."

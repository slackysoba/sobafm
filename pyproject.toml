[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[project]
name = "sobafm"
version = "0.0.0"
description = "A self-hosted Discord music bot for Linux and Docker."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["disnake[voice]==2.12.2"]

[dependency-groups]
evaluation = ["mutagen==1.48.1"]
dev = [
    "detect-secrets==1.5.0",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "pymarkdownlnt==0.9.41",
    "pyright[nodejs]==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[tool.uv]
required-version = "==0.13.6"
default-groups = ["dev", "evaluation"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pyright]
include = ["src", "tests", "evaluations/linux_resource", "evaluations/fma_validation"]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
    "evaluations/linux_resource/test_contract.py",
    "evaluations/linux_resource/test_overlap_contract.py",
    "evaluations/linux_resource/test_vbr_contract.py",
    "evaluations/linux_resource/test_flac_contract.py",
    "evaluations/linux_resource/test_cancel_contract.py",
    "evaluations/linux_resource/test_topology_contract.py",
    "evaluations/linux_resource/test_arm64_runner_preflight.py",
]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[project]
name = "sobafm"
version = "0.1.0"
description = "Self-hosted Discord bot that streams AI-generated music into voice channels with Gemini and Lyria RealTime."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jackson Fischer" }]
requires-python = ">=3.14"
dependencies = [
    "audioop-lts>=0.2.2",
    "discord-py[voice]>=2.7.1",
    "google-genai>=2.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
sobafm = "sobafm.__main__:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
required-version = "~=0.12.21"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle and pyflakes
    "I",            # import sorting
    "N",            # naming
    "B",            # likely bugs
    "BLE",          # blind except
    "C4",           # comprehensions
    "UP",           # modern syntax
    "SIM",          # simplifications
    "RET",          # return statements
    "PT",           # pytest style
    "PTH",          # pathlib
    "ASYNC",        # asyncio pitfalls
    "S",            # security
    "LOG", "G",     # logging
    "T20",          # print statements
    "PGH",          # precise suppressions
    "PLE", "PLW",   # pylint errors and warnings
    "RUF",          # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # pytest asserts and placeholder credentials
"scripts/**" = ["T20"]  # command-line tools report results on standard output
"tests/eval/**" = ["T20"]  # the evaluation set reports its results

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
strict = true
addopts = ["-ra", "-m", "not eval"]
markers = ["eval: the interpreter's evaluation set, which calls Gemini; run with -m eval"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Dependencies use APIs that Python 3.14 deprecates: typing internals in google-genai,
    # and positional re.sub() arguments in discord.py's escape_markdown.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
    "ignore:'count' is passed as positional argument:DeprecationWarning:discord.utils",
]

    Dir::Etc::parts "/plan/empty-parts";

    Dir::Etc::sourcelist "/plan/debian.sources";

    Dir::Etc::sourceparts "/plan/empty-parts";

    Dir::Etc::preferences "/plan/preferences";

    Dir::Etc::preferencesparts "/plan/empty-parts";

    Dir::State::lists "/plan/lists";

    Dir::State::status "/var/lib/dpkg/status";

    Dir::Cache "/plan/cache";

    Dir::Cache::archives "/plan/cache/archives";

    Dir::Cache::pkgcache "";

    Dir::Cache::srcpkgcache "";

    Dir::Log "/plan";

    Debug::NoLocking "true";

    Acquire::Languages "none";

    Acquire::Retries "0";

    Acquire::http::Timeout "15";

    Acquire::https::Timeout "15";

    Acquire::AllowInsecureRepositories "false";

    Acquire::AllowDowngradeToInsecureRepositories "false";

    Acquire::Check-Valid-Until "true";

    APT::Get::AllowUnauthenticated "false";

    '
